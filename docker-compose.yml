services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugbounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugbounty}
      POSTGRES_DB: ${POSTGRES_DB:-bugbounty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugbounty}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bugbounty}:${POSTGRES_PASSWORD:-bugbounty}@postgres:5432/${POSTGRES_DB:-bugbounty}
      SECRET: ${SECRET:-please_change_me_in_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Attachments: AWS S3 via access keys (set the S3_* vars in .env).
      # Leave S3_ENDPOINT empty for real AWS S3; set it for MinIO/R2/Spaces.
      # If S3_ACCESS_KEY/S3_SECRET_KEY are unset, attachment storage is disabled.
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      RATE_LIMIT_REPORTS: ${RATE_LIMIT_REPORTS:-10/hour}
      RATE_LIMIT_APPLICATIONS: ${RATE_LIMIT_APPLICATIONS:-3/hour}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      SEED_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # migrations then app; seed runs in-app on startup (SEED_ON_START)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
